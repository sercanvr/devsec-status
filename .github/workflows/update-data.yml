name: Update DevSec Status Data

on:
  schedule:
    # Runs every 6 hours UTC
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aaaed40ce7e68 # v3.0.0
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5a1 # v4.1.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch metrics from GitHub API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm run fetch:data

      - name: Commit & push updated static JSON data
        uses: stefanzweifel/git-auto-commit-action@8621497c8210a781d4a6964817a58a74e447b953 # v5.0.1
        with:
          commit_message: "chore(data): auto-update static metrics via GitHub Actions [skip ci]"
          file_pattern: 'src/data/*.json'
